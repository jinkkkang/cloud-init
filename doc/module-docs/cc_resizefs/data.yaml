cc_resizefs:
  description: |
    Resize filesystems to use all available space on their partitions. This
    module is useful along with ``cc_growpart`` and runs after it. By default,
    only the root filesystem is resized.

    Additional filesystems can be selected with ``resizefs.devices``. Each
    entry must be an absolute mount point that is already mounted when this
    module runs. Storage layers below the filesystem, such as LVM logical
    volumes, must be resized separately.

    By default, ``cc_resizefs`` blocks the boot process while resize commands
    are running. The operations can run in the background by setting
    ``resize_rootfs`` to ``noblock``. Set ``resize_rootfs`` to ``false`` to
    disable all filesystem resize operations.
  examples:
  - comment: |
      Example 1: Disable filesystem resize operations.
    file: cc_resizefs/example1.yaml
  - comment: |
      Example 2: Run resize operations in the background.
    file: cc_resizefs/example2.yaml
  - comment: |
      Example 3: Resize multiple mounted filesystems.
    file: cc_resizefs/example3.yaml
  name: Resizefs
  title: Resize filesystem
